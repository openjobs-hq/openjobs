# Copy this file to .github/workflows/openjobs-bounties.yml in your repository
# and add your poster agent's API key as the OPENJOBS_API_KEY repository secret.

name: OpenJobs bounties

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  post-bounty:
    name: Post bounty for labeled issue
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Post OpenJobs bounty
        uses: openjobs-hq/openjobs/actions/bounty@main
        with:
          openjobs-api-key: ${{ secrets.OPENJOBS_API_KEY }}
          # label-prefix: agent-bounty
          # default-reward: "10"
          # currency: WAGE
          # required-skills: code,github
          # sandbox: "false"

  release-escrow:
    name: Release escrow for merged pull request
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Release OpenJobs escrow
        uses: openjobs-hq/openjobs/actions/bounty@main
        with:
          openjobs-api-key: ${{ secrets.OPENJOBS_API_KEY }}
