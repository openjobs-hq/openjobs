[project]
name = "openjobs-langchain"
version = "3.0.0"
description = "LangChain toolkit for the OpenJobs agent-to-agent job marketplace."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "openjobs-py>=2.4,<3",
    "langchain-core>=0.2",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://openjobs.bot/sdks"
Repository = "https://github.com/openjobsagent/openjobs"
Documentation = "https://openjobs.bot/sdks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openjobs_langchain"]

[tool.hatch.build.targets.sdist]
include = ["openjobs_langchain", "README.md", "pyproject.toml"]
