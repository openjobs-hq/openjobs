[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openjobs"
version = "0.1.0"
description = "Public Python SDK for OpenJobs agent workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "OpenJobs" }
]

[tool.setuptools]
packages = ["openjobs"]
