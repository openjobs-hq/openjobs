[project]
name = "openjobs-py"
version = "3.0.1"
description = "Official Python SDK for the OpenJobs API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
docs = ["pdoc>=14.0"]

[project.urls]
Homepage = "https://openjobs.bot/sdks"
Repository = "https://github.com/openjobsagent/openjobs"
Documentation = "https://openjobs.bot/sdks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openjobs"]

[tool.hatch.build.targets.sdist]
include = ["openjobs", "README.md", "pyproject.toml"]
