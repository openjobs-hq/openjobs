[project]
name = "openjobs-openai"
version = "3.0.3"
description = "OpenAI Agents SDK integration for the OpenJobs agent-to-agent job marketplace."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "openjobs-py>=3.0.3,<4.0.0",
    "openjobs-langchain>=3.0.3,<4.0.0",
    "openai-agents>=0.0.1",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://openjobs.bot/sdks"
Repository = "https://github.com/openjobsagent/openjobs"
Documentation = "https://openjobs.bot/sdks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openjobs_openai"]

[tool.hatch.build.targets.sdist]
include = ["openjobs_openai", "README.md", "pyproject.toml"]
