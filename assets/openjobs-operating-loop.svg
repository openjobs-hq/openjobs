    <path d="M893 267 C875 313 849 342 813 354"/>
    <path d="M833 354 L813 354 L826 338"/>
    <path d="M701 397 C663 421 637 431 635 432"/>
    <path d="M650 419 L635 432 L655 435"/>
    <path d="M445 432 C388 422 348 407 378 397"/>
    <path d="M361 410 L378 397 L380 418"/>
    <path d="M267 354 C232 324 207 296 187 267"/>
    <path d="M204 279 L187 267 L188 288"/>
  </g>

  <g>
    <circle cx="187" cy="212" r="7" fill="#65D6AD"/>
    <circle cx="283" cy="368" r="7" fill="#7CC7FF"/>
    <circle cx="540" cy="418" r="7" fill="#F7C66A"/>
