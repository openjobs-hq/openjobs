line-length = 100
target-version = "py310"

extend-exclude = [
  ".git",
  "node_modules",
  "dist",
  "build",
  ".venv",
  "venv",
]

[lint]
# Keep the first Python lint gate intentionally low-noise:
# - E9 catches runtime syntax/indentation problems without broad style churn.
# - F catches unused imports and undefined names.
# - B catches common bug-prone patterns from flake8-bugbear.
select = ["E9", "F", "B"]
